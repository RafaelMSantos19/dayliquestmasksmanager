<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e0b36" />
      <stop offset="60%" stop-color="#0a0514" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#9333ea" stroke-width="12" />

  <!-- Outer Arcane Diamond -->
  <polygon points="256,48 440,256 256,464 72,256" fill="none" stroke="#7e22ce" stroke-width="6" stroke-dasharray="14 10" opacity="0.6" />
  
  <!-- Inner Shield / Emblem -->
  <path d="M 256 100 L 380 160 C 380 300 256 390 256 410 C 256 390 132 300 132 160 Z" 
        fill="#130722" stroke="url(#purpleGlow)" stroke-width="10" filter="url(#glow)" />

  <!-- Sword Blade -->
  <path d="M 256 120 L 268 310 L 256 340 L 244 310 Z" fill="#ffffff" />
  <path d="M 256 120 L 256 340 L 244 310 Z" fill="#c084fc" />
  
  <!-- Sword Guard -->
  <path d="M 210 320 L 302 320 L 285 336 L 227 336 Z" fill="url(#purpleGlow)" stroke="#f3e8ff" stroke-width="2" />

  <!-- Sword Hilt -->
  <rect x="250" y="336" width="12" height="34" fill="#a855f7" rx="3" />
  <!-- Sword Pommel Gem -->
  <circle cx="256" cy="382" r="12" fill="#e9d5ff" stroke="#9333ea" stroke-width="4" />

  <!-- Arcane Sparks -->
  <polygon points="256,70 262,86 278,92 262,98 256,114 250,98 234,92 250,86" fill="#f3e8ff" />
  <circle cx="180" cy="220" r="4" fill="#c084fc" />
  <circle cx="332" cy="220" r="4" fill="#c084fc" />
  <circle cx="200" cy="290" r="5" fill="#f3e8ff" />
  <circle cx="312" cy="290" r="5" fill="#f3e8ff" />
</svg>
